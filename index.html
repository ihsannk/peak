// ============================================================

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
}

function normalizeText(value) {
    return String(value ?? '').replace(/\s+/g, ' ').trim();
}

function yieldToBrowser() {
    return new Promise(resolve => setTimeout(resolve, 0));
}

function isWordChar(char) {
    return !!char && /[\p{L}\p{N}_]/u.test(char);
}

function isWholeWordAt(text, index, length) {
    return !isWordChar(text[index - 1]) && !isWordChar(text[index + length]);
}

function findMatches(text, query, caseSensitive, wholeWord) {
    const source = caseSensitive ? text : text.toLocaleLowerCase();
    const needle = caseSensitive ? query : query.toLocaleLowerCase();
    if (!needle) return [];
    const matches = [];
    let from = 0;
    while (from <= source.length - needle.length) {
        const index = source.indexOf(needle, from);
        if (index === -1) break;
        if (!wholeWord || isWholeWordAt(text, index, needle.length)) matches.push({ index, length: needle.length });
        from = index + Math.max(needle.length, 1);
    }
    return matches;
}

function createHighlightedSnippet(text, matchIndex, matchLength) {
    const start = Math.max(0, matchIndex - SNIPPET_RADIUS);
    const end = Math.min(text.length, matchIndex + matchLength + SNIPPET_RADIUS);
    const before = escapeHtml(text.slice(start, matchIndex));
    const match = escapeHtml(text.slice(matchIndex, matchIndex + matchLength));
    const after = escapeHtml(text.slice(matchIndex + matchLength, end));
    return `${start > 0 ? '... ' : ''}${before}<mark class="search-match">${match}</mark>${after}${end < text.length ? ' ...' : ''}`;
}

function getPdfUrl(pdfInfo) {
    return new URL(pdfInfo.name, window.location.href).href;
}

function getSelectedIndexes() {
    return Array.from(document.querySelectorAll('.document-checkbox:checked')).map(cb => Number(cb.dataset.pdfIndex));
}

function saveSelection() {
    try { localStorage.setItem(SELECTION_KEY, JSON.stringify(getSelectedIndexes())); } catch (_) {}
}

function loadSavedSelection() {
    try {
        const raw = localStorage.getItem(SELECTION_KEY);
        if (raw === null) {
            document.querySelectorAll('.document-checkbox').forEach(cb => cb.checked = true);
            return;
        }
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved)) return;
        document.querySelectorAll('.document-checkbox').forEach(cb => cb.checked = saved.includes(Number(cb.dataset.pdfIndex)));
    } catch (_) {
        document.querySelectorAll('.document-checkbox').forEach(cb => cb.checked = true);
    }
}

function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ caseSensitive: caseSensitiveCheck.checked, wholeWord: wholeWordCheck.checked })); } catch (_) {}
}

function loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
        if (saved) {
            caseSensitiveCheck.checked = !!saved.caseSensitive;
            wholeWordCheck.checked = !!saved.wholeWord;
        }
    } catch (_) {}
}

function addSearchHistory(query) {
    try {
        const history = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
        const updated = [query, ...history.filter(item => item !== query)].slice(0, 5);
        localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(updated));
    } catch (_) {}
    renderSearchHistory();
}

function renderSearchHistory() {
    const container = $('search-history');
    if (!container) return;
    let history = [];
    try { history = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]'); } catch (_) {}
    if (!history.length) { container.classList.add('hidden'); container.innerHTML = ''; return; }
    container.classList.remove('hidden');
    container.innerHTML = `<div class="flex flex-wrap items-center gap-2"><span class="text-xs font-semibold text-gray-500">Recent:</span>${history.map(item => `<button type="button" class="history-btn text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded-full border border-gray-200" data-query="${escapeHtml(item)}">${escapeHtml(item)}</button>`).join('')}</div>`;
    container.querySelectorAll('.history-btn').forEach(btn => btn.addEventListener('click', () => { searchInput.value = btn.dataset.query; updateSearchControls(); performSearch(); }));
}

function updateSearchControls() {
    clearSearchBtn.classList.toggle('hidden', !searchInput.value);

// ============================================================
// INDEXEDDB SEARCH CACHE
// ============================================================
function openDatabase() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(resolve => {
        if (!('indexedDB' in window)) return resolve(null);
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'key' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
    });
    return dbPromise;
}

async function readCachedText(key) {
    const db = await openDatabase();
    if (!db) return null;
    return new Promise(resolve => {
        const tx = db.transaction('documents', 'readonly');
        const req = tx.objectStore('documents').get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
    });
}

async function writeCachedText(record) {
    const db = await openDatabase();
    if (!db) return;
    await new Promise(resolve => {
        const tx = db.transaction('documents', 'readwrite');
        tx.objectStore('documents').put(record);
        tx.oncomplete = resolve;
        tx.onerror = resolve;
    });
}

function cacheKey(pdfInfo) {
    return `${APP_VERSION}|${pdfInfo.name}`;
}

// ============================================================
// PDF MANAGER
// ============================================================
async function getPdfDocument(pdfIndex) {
    if (pdfCache.has(pdfIndex)) return pdfCache.get(pdfIndex);
    const pdfInfo = pdfData[pdfIndex];
    const loadingTask = pdfjsLib.getDocument(getPdfUrl(pdfInfo));
    const promise = loadingTask.promise.catch(error => {
        pdfCache.delete(pdfIndex);
        throw error;
    });
    pdfCache.set(pdfIndex, promise);
    return promise;
}

async function loadPdfThumbnail(pdfIndex) {
    if (thumbnailCache.has(pdfIndex)) return thumbnailCache.get(pdfIndex);
    const pdfInfo = pdfData[pdfIndex];
    const listItem = $(`pdf-item-${pdfIndex}`);
    if (!listItem) return;
    const spinner = listItem.querySelector('.spinner-container');
    try {
        const pdfDoc = await getPdfDocument(pdfIndex);
        const page = await pdfDoc.getPage(1);
        const container = listItem.querySelector('.canvas-container');
        const canvas = document.createElement('canvas');
        canvas.className = 'cursor-pointer absolute top-0 left-0 w-full h-full object-contain';
        canvas.setAttribute('aria-label', `Open ${pdfInfo.displayName}`);
        canvas.title = `Open ${pdfInfo.displayName}`;
        container.appendChild(canvas);
        const baseViewport = page.getViewport({ scale: 1 });
        const targetWidth = Math.max(160, container.clientWidth || 180);
        const scale = Math.min(.55, targetWidth / baseViewport.width);
        const viewport = page.getViewport({ scale });
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.height = Math.ceil(viewport.height * ratio);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        const context = canvas.getContext('2d', { alpha: false });
        await page.render({ canvasContext: context, viewport, transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null }).promise;
        canvas.onclick = () => openPdfViewer(pdfIndex, 1);
        spinner?.remove();
        thumbnailCache.set(pdfIndex, canvas);
    } catch (error) {
        console.error(`Thumbnail error for ${pdfInfo.name}:`, error);
        if (spinner) spinner.innerHTML = '<span class="text-red-500 font-semibold text-xs text-center p-2">Failed to load</span>';
    }
}

async function extractPdfText(pdfIndex, progressCallback) {
    const pdfInfo = pdfData[pdfIndex];
    if (pdfInfo.content !== null) return pdfInfo.content;
    if (pdfInfo.extractPromise) return pdfInfo.extractPromise;

    pdfInfo.extractPromise = (async () => {
        const cached = await readCachedText(cacheKey(pdfInfo));
        if (cached && Array.isArray(cached.content)) {
            pdfInfo.content = cached.content;
            return pdfInfo.content;
        }
        const pdfDoc = await getPdfDocument(pdfIndex);
        const extracted = new Array(pdfDoc.numPages);
        for (let pageNo = 1; pageNo <= pdfDoc.numPages; pageNo++) {
            const page = await pdfDoc.getPage(pageNo);
            const textContent = await page.getTextContent();
            extracted[pageNo - 1] = normalizeText(textContent.items.map(item => item.str).join(' '));
            if (progressCallback) progressCallback(pageNo, pdfDoc.numPages);
            if (pageNo % 5 === 0) await yieldToBrowser();
        }
        pdfInfo.content = extracted;
        await writeCachedText({ key: cacheKey(pdfInfo), filename: pdfInfo.name, displayName: pdfInfo.displayName, content: extracted, savedAt: Date.now() });
        return extracted;
    })().catch(error => {
        console.error(`Text extraction error for ${pdfInfo.name}:`, error);
        pdfInfo.content = [''];
        throw error;
    }).finally(() => { pdfInfo.extractPromise = null; });

    return pdfInfo.extractPromise;
}

function setupIntersectionObserver() {
    if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.pdf-list-item').forEach(item => loadPdfThumbnail(Number(item.dataset.pdfIndex)));
        return;
    }
    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const item = entry.target;
            if (item.dataset.thumbnailLoaded !== 'true') {
                item.dataset.thumbnailLoaded = 'true';
                loadPdfThumbnail(Number(item.dataset.pdfIndex));
            }
            obs.unobserve(item);
        });
    }, { rootMargin: '150px', threshold: .01 });
    document.querySelectorAll('.pdf-list-item').forEach(item => observer.observe(item));
}

function updateProgress(status, percentage) {
    const statusEl = $('search-status');
    const bar = $('search-progress-bar');
    const text = $('search-progress-text');

// ============================================================
// GOOGLE ANALYTICS / PEAK USAGE TRACKING
// ============================================================
function trackEvent(eventName, parameters = {}) {
    if (typeof window.gtag !== 'function') return;
    try {
        window.gtag('event', eventName, parameters);
    } catch (_) {}
}

function cleanSearchTerm(term) {
    // Keep analytics useful while avoiding accidental long/personal strings.
    return String(term || '').trim().replace(/\s+/g, ' ').slice(0, 100);
}

function getAnalyticsDocumentName(pdfIndex) {
    return pdfData[pdfIndex]?.displayName || `Document ${pdfIndex + 1}`;
}

async function performSearch() {
    const token = ++currentSearchToken;
    const query = searchInput.value.trim();
    currentSearchQuery = query;
    const caseSensitive = caseSensitiveCheck.checked;
    const wholeWord = wholeWordCheck.checked;
    saveSettings();

    if (!query) { showEmptyState('Please enter a search term', 'Type a keyword, section number or phrase above.'); return; }
    const selected = getSelectedIndexes();
    if (!selected.length) { showEmptyState('No documents selected', 'Select at least one document before searching.'); return; }

    addSearchHistory(query);
    updateUrlState(query);
    trackEvent('peak_search', {
        search_term: cleanSearchTerm(query),
        documents_selected: selected.length,
        case_sensitive: caseSensitive,
        whole_word: wholeWord
    });
    resultsSectionContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    renderSearchProgress('Preparing search', `0 of ${selected.length} documents`, 0);

    const allResults = [];
    let totalMatches = 0;

    for (let i = 0; i < selected.length; i++) {
        if (token !== currentSearchToken) return;
        const pdfIndex = selected[i];
        const pdf = pdfData[pdfIndex];
        updateProgress(`Indexing: ${pdf.displayName}`, Math.round((i / selected.length) * 100));
        try {
            await extractPdfText(pdfIndex, (pageNo, totalPages) => {
                const base = (i / selected.length) * 100;
                const fraction = (pageNo / totalPages) * (100 / selected.length);
                updateProgress(`Reading page ${pageNo} of ${totalPages}: ${pdf.displayName}`, Math.min(99, Math.round(base + fraction)));
            });
        } catch (_) {
            allResults.push({ pdfIndex, error: true, pages: [] });
            continue;
        }

        const pages = [];
        pdf.content.forEach((pageText, pageIndex) => {
            const matches = findMatches(pageText, query, caseSensitive, wholeWord);
            if (!matches.length) return;
            totalMatches += matches.length;
            pages.push({ pageNum: pageIndex + 1, text: pageText, matches });
        });
        if (pages.length) allResults.push({ pdfIndex, error: false, pages });
        updateProgress(`${i + 1} of ${selected.length} documents scanned`, Math.round(((i + 1) / selected.length) * 100));
        await yieldToBrowser();
    }

    if (token !== currentSearchToken) return;
    renderResults(allResults, totalMatches, query);
}

function renderResults(resultGroups, totalMatches, query) {
    resultsContainer.innerHTML = '';
    if (!resultGroups.some(group => group.pages?.length)) {
        const failed = resultGroups.filter(group => group.error).length;
        const message = failed ? `No matches found. ${failed} document${failed > 1 ? 's' : ''} could not be indexed.` : 'No results found for your query in the selected documents.';
        resultsContainer.innerHTML = `<div class="py-12 text-center"><p class="text-gray-600 font-medium text-lg">${escapeHtml(message)}</p><p class="text-sm text-gray-400 mt-2">Try a shorter keyword, a different spelling, or change the search options.</p></div>`;
        mainSearchCount.classList.add('hidden');
        return;
    }

    mainSearchCount.textContent = `${totalMatches.toLocaleString()} ${totalMatches === 1 ? 'match' : 'matches'} found`;
    mainSearchCount.classList.remove('hidden');

    const summary = document.createElement('div');
    summary.className = 'mb-5 p-4 bg-gray-50 border border-gray-200 rounded-xl flex flex-wrap items-center justify-between gap-3';
    summary.innerHTML = `<div><span class="font-bold text-[#041E42]">${totalMatches.toLocaleString()}</span> match${totalMatches === 1 ? '' : 'es'} for <span class="font-bold text-[#F27E23]">“${escapeHtml(query)}”</span></div><button type="button" id="new-search-focus" class="text-sm font-semibold text-[#041E42] hover:underline">New search</button>`;
    resultsContainer.appendChild(summary);
    $('new-search-focus').addEventListener('click', () => { searchInput.focus(); searchInput.select(); });

    resultGroups.filter(group => group.pages?.length).forEach(group => {
        const pdf = pdfData[group.pdfIndex];
        const card = document.createElement('article');
        card.className = 'mb-6 p-5 md:p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow';
        const totalPages = group.pages.length;
        card.innerHTML = `<div class="flex items-start gap-3 mb-4 border-b border-gray-100 pb-4"><div class="bg-orange-100 p-2.5 rounded-lg shadow-inner flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#F27E23]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253"></path></svg></div><div><h3 class="text-lg md:text-xl font-bold text-[#041E42]">${escapeHtml(pdf.displayName)}</h3><p class="text-xs text-gray-500 mt-1">${totalPages} matching page${totalPages === 1 ? '' : 's'}</p></div></div>`;

        group.pages.forEach(page => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'mt-4 pl-4 border-l-4 border-[#041E42] bg-gray-50 p-4 rounded-r-xl relative group';
            const sectionName = detectSectionName(page.text, page.matches[0].index);
            const title = `Page ${page.pageNum}${sectionName ? ` | ${sectionName}` : ''}`;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'float-right ml-3 mb-2 bg-white border border-gray-200 text-[#041E42] font-bold py-1.5 px-3 rounded-md hover:bg-[#041E42] hover:text-white transition-all text-sm shadow-sm';
            button.textContent = 'View Match →';
            button.addEventListener('click', () => {
                trackEvent('peak_search_result_open', {
                    document_name: getAnalyticsDocumentName(group.pdfIndex),
                    page_number: page.pageNum,
                    search_term: cleanSearchTerm(query)
                });
                openPdfViewer(group.pdfIndex, page.pageNum);
            });
            pageDiv.innerHTML = `<p class="font-bold text-gray-800 mb-3 text-base">📄 ${escapeHtml(title)}</p>`;
            pageDiv.appendChild(button);

            page.matches.slice(0, MAX_VISIBLE_SNIPPETS_PER_PAGE).forEach(match => {
                const snippet = document.createElement('p');
                snippet.className = 'text-gray-700 leading-relaxed mt-2 text-sm bg-white p-3 rounded-md border border-gray-100 shadow-sm font-medium';
                snippet.innerHTML = createHighlightedSnippet(page.text, match.index, match.length);
                pageDiv.appendChild(snippet);
            });
            if (page.matches.length > MAX_VISIBLE_SNIPPETS_PER_PAGE) {
                const more = document.createElement('p');
                more.className = 'text-xs text-gray-500 mt-2 font-semibold';
                more.textContent = `+ ${page.matches.length - MAX_VISIBLE_SNIPPETS_PER_PAGE} more match${page.matches.length - MAX_VISIBLE_SNIPPETS_PER_PAGE === 1 ? '' : 'es'} on this page`;
                pageDiv.appendChild(more);
            }
            card.appendChild(pageDiv);
        });
        resultsContainer.appendChild(card);
    });
}

function detectSectionName(pageText, matchIndex) {
    const before = pageText.slice(0, matchIndex);
    const regex = /(?:Section|Seksyen|Peraturan|Regulation|Part|Bahagian|Rule|Kaedah)\s+[A-Z0-9]+(?:\.[A-Z0-9]+)*/gi;
    let found = '';
    let match;
    while ((match = regex.exec(before)) !== null) found = match[0];
    return found ? found.replace(/\s+/g, ' ').trim() : '';
}

// ============================================================
// PDF VIEWER
// ============================================================
function initializeViewer() {
    if (peakPdfViewer) return;
    peakEventBus = new pdfjsViewer.EventBus();
    peakLinkService = new pdfjsViewer.PDFLinkService({ eventBus: peakEventBus });
    peakPdfFindController = new pdfjsViewer.PDFFindController({ eventBus: peakEventBus, linkService: peakLinkService });
    peakPdfViewer = new pdfjsViewer.PDFViewer({ container: $('viewerContainer'), eventBus: peakEventBus, linkService: peakLinkService, findController: peakPdfFindController });
    peakLinkService.setViewer(peakPdfViewer);
    peakEventBus.on('pagesinit', () => {
        peakPdfViewer.currentScaleValue = 'page-width';
        setTimeout(() => {
            if (pendingPageNum) peakPdfViewer.currentPageNumber = pendingPageNum;
            executeViewerSearch();
        }, 100);
    });
}

function executeViewerSearch(findAgain = false, findPrevious = false) {
    if (!peakPdfFindController) return;
    const query = viewerSearchInput.value.trim();
    if (query) {
        trackEvent('peak_pdf_search', {
            search_term: cleanSearchTerm(query),
            document_name: pdfViewerTitle.textContent || 'Unknown document',
            find_previous: findPrevious
        });
    }
    if (!query) {
        peakPdfFindController.executeCommand('find', { query: '' });
        return;
    }
    peakPdfFindController.executeCommand(findAgain ? 'findagain' : 'find', {
        query,
        highlightAll: true,
        phraseSearch: true,
        caseSensitive: caseSensitiveCheck.checked,
        findPrevious
    });
}

function openPdfViewer(pdfIndex, pageNumToShow = 1) {
    const pdfItem = pdfData[pdfIndex];
    if (!pdfItem) return;
    trackEvent('peak_pdf_open', {
        document_name: pdfItem.displayName,
        document_category: pdfItem.category || 'Unknown',
        page_number: pageNumToShow
    });
    previousFocusedElement = document.activeElement;
    pdfViewerTitle.textContent = pdfItem.displayName;
    viewerSearchInput.value = currentSearchQuery;
    pendingPageNum = pageNumToShow;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.classList.add('modal-open');
    initializeViewer();

    const pdfUrl = getPdfUrl(pdfItem);
    if (peakPdfViewer.pdfDocument && currentViewerPdfUrl === pdfUrl) {
        peakPdfViewer.currentPageNumber = pageNumToShow;
        setTimeout(() => executeViewerSearch(), 100);
        viewerSearchInput.focus();
        return;
    }

    currentViewerPdfUrl = pdfUrl;
    const container = $('viewerContainer');
    container.style.opacity = '.5';
    peakPdfViewer.setDocument(null);
    getPdfDocument(pdfIndex).then(pdfDocument => {
        if (currentViewerPdfUrl !== pdfUrl) return;
        peakPdfViewer.setDocument(pdfDocument);
        peakLinkService.setDocument(pdfDocument, null);
        container.style.opacity = '1';
    }).catch(error => {
        console.error('Viewer error:', error);
        container.style.opacity = '1';
        const errorBox = document.createElement('div');
        errorBox.className = 'absolute inset-0 flex items-center justify-center p-6 pointer-events-none';
        errorBox.innerHTML = '<p class="text-red-500 font-bold bg-white p-4 rounded shadow pointer-events-auto">Unable to load this PDF. Please check that the file exists.</p>';
        container.appendChild(errorBox);
    });
}

function closePdfViewer() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.classList.remove('modal-open');
    if (peakPdfFindController) peakPdfFindController.executeCommand('find', { query: '' });
    previousFocusedElement?.focus?.();
}

// ============================================================
// URL / DEEP LINKING
// ============================================================
function updateUrlState(query) {
    try {
        const url = new URL(window.location.href);
        if (query) url.searchParams.set('q', query); else url.searchParams.delete('q');
        window.history.replaceState({}, '', url);
    } catch (_) {}
}

function restoreUrlSearch() {
    try {
        const query = new URLSearchParams(window.location.search).get('q');
        if (query) { searchInput.value = query; updateSearchControls(); setTimeout(() => performSearch(), 200); }
    } catch (_) {}
}

    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
    searchBtn.addEventListener('click', performSearch);
    clearSearchBtn.addEventListener('click', () => { ++currentSearchToken; searchInput.value = ''; updateSearchControls(); updateUrlState(''); showEmptyState('Search cleared', 'Enter a keyword above to scan the PEAK archives.'); searchInput.focus(); });
    caseSensitiveCheck.addEventListener('change', saveSettings);
    wholeWordCheck.addEventListener('change', saveSettings);
    closeModalBtn.addEventListener('click', closePdfViewer);
    viewerSearchInput.addEventListener('input', () => executeViewerSearch());
    viewerSearchInput.addEventListener('keydown', e => { if (e.key === 'Enter') executeViewerSearch(true, e.shiftKey); });
    viewerSearchNext.addEventListener('click', () => executeViewerSearch(true, false));
    viewerSearchPrev.addEventListener('click', () => executeViewerSearch(true, true));
    modal.addEventListener('mousedown', e => { if (e.target === modal) closePdfViewer(); });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) { closePdfViewer(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
        if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !modal.classList.contains('flex')) { e.preventDefault(); searchInput.focus(); }
    });

    window.addEventListener('scroll', () => backToTopBtn.classList.toggle('hidden', window.scrollY <= 300), { passive: true });
    backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    document.querySelectorAll('.collapsible-section > button').forEach(button => button.addEventListener('click', () => {
        const section = button.parentElement;
        const open = section.classList.toggle('open');
        button.setAttribute('aria-expanded', String(open));
    }));
}

function initializeApp() {
    trackEvent('peak_app_open', {
        page_title: document.title,
        screen_width: window.innerWidth,
        screen_height: window.innerHeight
    });
    populatePdfList();
    setupEventListeners();
    loadSettings();
    renderSearchHistory();
    updateThumbnailButtonState();
    initialLoader.classList.add('hidden');
    searchBtn.disabled = false;
    restoreUrlSearch();
}

document.addEventListener('DOMContentLoaded', initializeApp);
</script>
</body>
</html>
