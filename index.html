<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEAK - Pharmacy Enforcement Archive of Knowledge</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js Core & Viewer Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf_viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf_viewer.min.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        
        .pdf-list-item canvas {
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, opacity 0.3s;
            background-color: #ffffff;
            width: 100%;
            height: auto;
        }
        .pdf-list-item:hover canvas {
            transform: translateY(-5px);
        }
        .thumbnails-hidden .pdf-list-item .canvas-container {
            display: none;
        }
        
        .textLayer .highlight {
            background-color: rgba(242, 126, 35, 0.5) !important;
            border-radius: 2px;
        }
        .textLayer .highlight.selected {
            background-color: rgba(67, 185, 255, 0.8) !important;
        }

        @media (max-width: 767px) {
            .collapsible-content { display: none; }
            .collapsible-section.open .collapsible-content { display: block; }
            .collapsible-section.open .chevron-down { display: none; }
            .collapsible-section:not(.open) .chevron-up { display: none; }
        }
        
        /* Hide scrollbar for Tab Navigation */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 relative">

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="mb-8 flex justify-center">
             <img src="peak.png" alt="PEAK Logo" class="h-20 w-4/5 sm:w-auto" title="PEAK | Pharmacy Enforcement Archive of Knowledge" onerror="this.src='https://placehold.co/400x100/041E42/FFFFFF?text=PEAK+Archive'">
        </header>

        <main>
            <div class="bg-white p-6 rounded-lg shadow-lg mb-8 collapsible-section open">
                 <button class="w-full flex justify-between items-center text-left md:hidden mb-4">
                    <h2 class="text-2xl font-semibold text-[#041E42]">Search Archive</h2>
                    <svg class="w-6 h-6 chevron-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                    <svg class="w-6 h-6 chevron-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" /></svg>
                </button>
                <div class="collapsible-content">
                    <h2 class="text-2xl font-semibold mb-4 text-[#041E42] hidden md:block">Search Archive</h2>
                    <div class="relative">
                        <!-- Magnifying glass icon inside the search bar -->
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="text" id="search-input" placeholder="Enter search term to scan archives..." class="w-full pl-11 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#041E42] text-lg">
                        <button id="clear-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-2xl font-bold">&times;</button>
                    </div>
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mt-4 gap-4">
                        <div class="flex flex-col sm:flex-row gap-4 sm:gap-6">
                            <label class="flex items-center cursor-pointer group">
                                <input type="checkbox" id="case-sensitive-check" class="h-5 w-5 accent-[#041E42] cursor-pointer">
                                <span class="ml-2 text-gray-700 group-hover:text-gray-900">Case-sensitive</span>
                            </label>
                            <label class="flex items-center cursor-pointer group">
                                <input type="checkbox" id="whole-word-check" class="h-5 w-5 accent-[#041E42] cursor-pointer">
                                <span class="ml-2 text-gray-700 group-hover:text-gray-900">Match whole word</span>
                            </label>
                        </div>
                        <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                            <span id="main-search-count" class="text-[#F27E23] text-sm font-bold bg-orange-50 px-3 py-1 rounded-md hidden"></span>
                            <button id="search-btn" class="bg-[#041E42] text-white font-bold py-3 px-8 rounded-lg hover:bg-opacity-90 transition disabled:bg-gray-400 w-full md:w-auto shadow-md">Search</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="document-selection" class="bg-white p-6 rounded-lg shadow-lg mb-8 collapsible-section open">
                <button class="w-full flex justify-between items-center text-left md:hidden mb-4">
                    <h2 class="text-2xl font-semibold text-[#041E42]">Filter Documents</h2>
                    <svg class="w-6 h-6 chevron-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                    <svg class="w-6 h-6 chevron-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" /></svg>
                </button>

                <div class="collapsible-content">
                    <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                        <h2 class="text-2xl font-semibold text-[#041E42] hidden md:block">Filter Documents</h2>
                        <div class="flex gap-2 flex-wrap">
                            <button id="toggle-thumbnails-btn" class="text-sm font-semibold py-1.5 px-3 rounded-md transition-colors">Toggle Thumbnails</button>
                            <button id="select-all-btn" class="text-sm font-semibold py-1.5 px-3 rounded-md transition-colors">Select All</button>
                            <button id="deselect-all-btn" class="text-sm font-semibold py-1.5 px-3 rounded-md transition-colors">Deselect All</button>
                        </div>
                    </div>
                    
                    <!-- Tab Navigation Header -->
                    <div id="pdf-tabs-header" class="flex border-b border-gray-200 mb-6 overflow-x-auto hide-scrollbar gap-2"></div>
                    
                    <div id="initial-loader-container" class="text-center my-4">
                        <p class="mt-2 text-gray-600 font-medium animate-pulse">Loading document architecture...</p>
                    </div>
                    <div id="pdf-list-categories"></div>
                </div>
            </div>

            <div id="results-container" class="bg-white p-6 rounded-lg shadow-lg collapsible-section open">
                 <button class="w-full flex justify-between items-center text-left md:hidden mb-4">
                    <h2 class="text-2xl font-semibold text-[#041E42]">Search Results</h2>
                    <svg class="w-6 h-6 chevron-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                    <svg class="w-6 h-6 chevron-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" /></svg>
                </button>
                <div id="results" class="collapsible-content text-gray-700">
                     <h2 class="text-2xl font-semibold mb-4 text-[#041E42] hidden md:block">Search Results</h2>
                     
                     <!-- Premium Empty State -->
                     <div class="flex flex-col items-center justify-center py-16 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                        <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
                        <p class="text-xl font-semibold text-gray-500 mb-1">Your search results will appear here</p>
                        <p class="text-sm">Enter a keyword above to scan the PEAK archives.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="pdf-viewer-modal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center p-2 md:p-6 z-50">
        <div class="bg-white rounded-lg shadow-2xl w-full h-full flex flex-col relative overflow-hidden">
            <div class="flex flex-col sm:flex-row justify-between items-center px-4 py-2 border-b bg-[#f0f4f8] flex-shrink-0 z-10 min-h-[56px] shadow-sm gap-2">
                <div class="flex items-center gap-3 overflow-hidden w-full sm:w-1/3">
                    <div class="bg-[#041E42] text-white p-1.5 rounded flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h3 id="pdf-viewer-title" class="text-lg font-bold truncate text-[#041E42]">PDF Viewer</h3>
                </div>
                
                <div class="flex items-center justify-center w-full sm:w-1/3">
                    <div class="relative w-full max-w-sm flex items-center bg-white border border-gray-300 rounded-md overflow-hidden shadow-sm">
                        <input type="text" id="viewer-search-input" placeholder="Find in document..." class="w-full px-3 py-1.5 focus:outline-none text-sm">
                        <button id="viewer-search-prev" class="px-2 py-1.5 text-gray-500 hover:text-[#041E42] hover:bg-gray-100 border-l border-gray-200 transition-colors" title="Previous match">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button id="viewer-search-next" class="px-2 py-1.5 text-gray-500 hover:text-[#041E42] hover:bg-gray-100 border-l border-gray-200 transition-colors" title="Next match">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="flex justify-end w-full sm:w-1/3">
                    <button id="close-modal-btn" class="text-gray-400 hover:text-red-600 transition-colors text-3xl font-bold leading-none">&times;</button>
                </div>
            </div>
            
            <!-- Custom Viewer Container -->
            <div id="viewerContainer" class="absolute left-0 right-0 bottom-0 top-[96px] sm:top-[56px] overflow-auto bg-gray-200">
                <div id="viewer" class="pdfViewer"></div>
            </div>
        </div>
    </div>
    
    <footer class="text-center py-6 mt-8">
        <p class="text-gray-500 font-medium">Pharmacy Enforcement Archive of Knowledge</p>
        <p class="text-sm text-gray-400">&copy; 2026 PEAK Database</p>
    </footer>

    <button id="back-to-top-btn" title="Back to Top" class="hidden fixed bottom-5 right-5 bg-[#041E42] text-white rounded-full p-3 shadow-2xl hover:bg-opacity-90 hover:-translate-y-1 transition-all z-40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
        </svg>
    </button>

    <script>
        // Setup PDF.js web worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        // --- CONFIGURATION ---
        const PDF_CATEGORIES = [
             {
                category: "Acts",
                files: [
                    { filename: "Act-574-Penal-Code.pdf", displayName: "Penal Code" },
                    { filename: "Act 593pdf.pdf", displayName: "Criminal Procedure Code" },
                    { filename: "Act-56-Evidence-Act-2017.pdf", displayName: "Evidence Act 1950" },
                    { filename: "Act 91.pdf", displayName: "Courts of Judicature Act 1964" },
                    { filename: "Act 92.pdf", displayName: "Subordinate Courts Act 1948" },
                    { filename: "act-366_2023.pdf", displayName: "Poisons Act 1952" },
                    { filename: "sales-drug-act-1952-act-368.pdf", displayName: "Sale of Drugs Act 1952" },
                    { filename: "medicine-advertisement-sale-act-1956-act-290_2.pdf", displayName: "Medicines (Advertisement and Sale) Act 1956" },
                    { filename: "registration-pharmacists-act-1951-act-371_2.pdf", displayName: "Registration of Pharmacists Act 1951" },
                    { filename: "dangerous-drugs-act-1952-act-234_1.pdf", displayName: "Dangerous Drugs Act 1952" },
                    { filename: "act723.pdf", displayName: "Price Control and Anti-Profiteering Act 2011"},
                    { filename: "STA2010_2023.pdf", displayName: "Strategic Trade Act 2010"},
                    { filename: "Act 613_2022.pdf", displayName: "Anti-Money Laundering, Anti-Terrorism Financing and Proceeds of Unlawful Activities Act 2001 (Act 613)"} // NEW AKTA
                ]
            },
            {
                category: "Regulations",
                files: [
                    { filename: "poison-regulations-1952-2.pdf", displayName: "Poisons Regulations 1952" },
                    { filename: "poisons-psychotropic-substances-regulations-1989-2-0_0.pdf", displayName: "Poisons (Psychotropic Substances) Regulations 1989" },
                    { filename: "poisons-sodium-hydroxide-regulations-1962-0.pdf", displayName: "Poisons (Sodium Hydroxide) Regulations 1962" },
                    { filename: "peraturan-peraturan-racun-pengkompaunan-kesalahan-2023.pdf", displayName: "Peraturan-Peraturan Racun (Pengkompaunan Kesalahan) 2023" },
                    { filename: "control-drugs-and-cosmetics-regulations-1984.pdf", displayName: "Control of Drugs and Cosmetics Regulations 1984" },
                    { filename: "medicine-advertisements-board-regulations-1976-19092024_0.pdf", displayName: "Medicines (Advertisement Board) Regulations 1976" },
                    { filename: "registration-pharmacists-regulations-2004_0.pdf", displayName: "Registration of Pharmacists Regulations 2004" },
                    { filename: "dangerous-drugs-regulations-1952-clean.pdf", displayName: "Dangerous Drugs Regulations 1952" },
                    { filename: "price-control-compounding-offences-regulations-1994.pdf", displayName: "Price Control (Compounding of Offences) Regulations 1994" },
                    { filename: "price-control-compounding-offences-amendment-regulations-2000.pdf", displayName: "Price Control (Compounding of Offences) (Amendment) Regulations 2000" }
                ]
            },
            {
                category: "Orders",
                files: [
                    { filename: "PUA141.pdf", displayName: "Price Control and Anti-Profiteering (Price Marking for Drug) Order 2025" },
                    { filename: "PUA314.pdf", displayName: "Price Control and Anti-Profiteering (Price Marking for Goods and Charges for Services) Order 2020" }
                ]
            }
        ];
        
        // --- DOM Elements ---
        const pdfListCategoriesContainer = document.getElementById('pdf-list-categories');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const mainSearchCount = document.getElementById('main-search-count');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const selectAllBtn = document.getElementById('select-all-btn');
        const deselectAllBtn = document.getElementById('deselect-all-btn');
        const toggleThumbnailsBtn = document.getElementById('toggle-thumbnails-btn');
        const caseSensitiveCheck = document.getElementById('case-sensitive-check');
        const wholeWordCheck = document.getElementById('whole-word-check');
        const resultsContainer = document.getElementById('results');
        const resultsSectionContainer = document.getElementById('results-container');
        const initialLoader = document.getElementById('initial-loader-container');
        const modal = document.getElementById('pdf-viewer-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const pdfViewerTitle = document.getElementById('pdf-viewer-title');
        const viewerSearchInput = document.getElementById('viewer-search-input');
        const viewerSearchNext = document.getElementById('viewer-search-next');
        const viewerSearchPrev = document.getElementById('viewer-search-prev');
        const backToTopBtn = document.getElementById('back-to-top-btn');

        // --- State Variables ---
        let pdfData = [];
        let currentSearchQuery = '';
        
        // Viewer State variables
        let peakPdfViewer = null;
        let peakPdfFindController = null;
        let peakEventBus = null;

        document.addEventListener('DOMContentLoaded', initializeApp);

        function initializeApp() {
            populatePdfList();
            setupEventListeners();
            updateSelectionButtons();
            updateThumbnailButtonState();
            initialLoader.classList.add('hidden');
            searchBtn.disabled = false;
        }

        // Tab Switching Logic
        function switchTab(activeIndex) {
            const tabs = document.querySelectorAll('#pdf-tabs-header button');
            const panels = document.querySelectorAll('#pdf-list-categories .tab-panel');
            
            tabs.forEach((tab, index) => {
                if (index === activeIndex) {
                    tab.className = 'whitespace-nowrap py-3 px-6 border-b-2 font-bold text-sm transition-colors border-[#041E42] text-[#041E42]';
                    panels[index].classList.remove('hidden');
                    panels[index].classList.add('block');
                } else {
                    tab.className = 'whitespace-nowrap py-3 px-6 border-b-2 font-medium text-sm transition-colors border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300';
                    panels[index].classList.remove('block');
                    panels[index].classList.add('hidden');
                }
            });
        }

        function populatePdfList() {
            let globalFileIndex = 0;
            const tabHeader = document.getElementById('pdf-tabs-header');

            PDF_CATEGORIES.forEach((category, catIndex) => {
                // Create Tab Button
                const tabBtn = document.createElement('button');
                tabBtn.className = `whitespace-nowrap py-3 px-6 border-b-2 font-bold text-sm transition-colors ${catIndex === 0 ? 'border-[#041E42] text-[#041E42]' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`;
                tabBtn.textContent = category.category;
                tabBtn.onclick = () => switchTab(catIndex);
                if(tabHeader) tabHeader.appendChild(tabBtn);

                // Create Tab Panel
                const categoryContainer = document.createElement('div');
                categoryContainer.id = `tab-panel-${catIndex}`;
                categoryContainer.className = `tab-panel ${catIndex === 0 ? 'block' : 'hidden'}`;
                
                const gridContainer = document.createElement('div');
                gridContainer.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-4 gap-y-6 pt-4";
                categoryContainer.appendChild(gridContainer);
                pdfListCategoriesContainer.appendChild(categoryContainer);

                category.files.forEach(pdfInfo => {
                    const currentIndex = globalFileIndex++;
                    pdfData.push({ 
                        name: pdfInfo.filename, 
                        displayName: pdfInfo.displayName, 
                        content: null,
                        isExtracting: false
                    });

                    const listItem = document.createElement('div');
                    listItem.className = 'pdf-list-item flex flex-col items-center';
                    listItem.id = `pdf-item-${currentIndex}`;
                    listItem.dataset.pdfIndex = currentIndex;
                    listItem.dataset.thumbnailLoaded = 'false';

                    listItem.innerHTML = `
                        <div class="canvas-container relative w-full" style="padding-top: 141.42%;">
                            <div class="spinner-container absolute inset-0 flex items-center justify-center bg-gray-50 rounded-md border border-gray-100">
                                <div class="h-6 w-6 border-2 border-gray-300 border-t-orange-500 rounded-full animate-spin"></div>
                            </div>
                        </div>
                        <div class="mt-3 text-center w-full h-20">
                            <label for="pdf-check-${currentIndex}" class="flex items-start justify-center cursor-pointer group">
                                <input type="checkbox" id="pdf-check-${currentIndex}" data-pdf-index="${currentIndex}" class="mr-2 h-4 w-4 accent-[#041E42] flex-shrink-0 mt-0.5 cursor-pointer" checked onchange="updateSelectionButtons()">
                                <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors break-words leading-snug">${pdfInfo.displayName}</span>
                            </label>
                        </div>
                    `;
                    gridContainer.appendChild(listItem);
                });
            });
            setupIntersectionObserver();
        }

        function setupIntersectionObserver() {
            const options = { rootMargin: '50px', threshold: 0.1 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const listItem = entry.target;
                        if (listItem.dataset.thumbnailLoaded === 'false') {
                            const pdfIndex = parseInt(listItem.dataset.pdfIndex);
                            loadPdfThumbnail(pdfIndex);
                            listItem.dataset.thumbnailLoaded = 'true';
                        }
                        observer.unobserve(listItem);
                    }
                });
            }, options);

            document.querySelectorAll('.pdf-list-item').forEach(item => {
                observer.observe(item);
            });
        }

        async function loadPdfThumbnail(pdfIndex) {
            const pdfInfo = pdfData[pdfIndex];
            const listItem = document.getElementById(`pdf-item-${pdfIndex}`);
            const spinnerContainer = listItem.querySelector('.spinner-container');
            
            try {
                const pdfDoc = await pdfjsLib.getDocument(pdfInfo.name).promise;
                const page = await pdfDoc.getPage(1);
                const canvas = document.createElement('canvas');
                canvas.className = 'cursor-pointer absolute top-0 left-0 w-full h-full object-contain';
                listItem.querySelector('.canvas-container').appendChild(canvas);
                
                canvas.onclick = () => openPdfViewer(pdfIndex, 1);
                const viewport = page.getViewport({ scale: 1.0 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                if (spinnerContainer) spinnerContainer.remove();
            } catch (error) {
                console.error(`Error loading thumbnail for ${pdfInfo.name}:`, error);
                if (spinnerContainer) {
                   spinnerContainer.innerHTML = `<span class="text-red-500 font-semibold text-xs text-center p-2">Failed to load</span>`;
                }
            }
        }
        
        async function extractPdfText(pdfIndex) {
            const pdfInfo = pdfData[pdfIndex];
            if (pdfInfo.content !== null || pdfInfo.isExtracting) return;

            pdfInfo.isExtracting = true;
            try {
                const pdfDoc = await pdfjsLib.getDocument(pdfInfo.name).promise;
                let extractedText = [];
                for (let j = 1; j <= pdfDoc.numPages; j++) {
                    const page = await pdfDoc.getPage(j);
                    const textContent = await page.getTextContent();
                    extractedText.push(textContent.items.map(item => item.str).join(' '));
                }
                pdfData[pdfIndex].content = extractedText;
            } catch (error) {
                console.error(`Failed to extract text from ${pdfInfo.name}:`, error);
                pdfData[pdfIndex].content = ["Error: Could not load document content."];
            } finally {
                pdfData[pdfIndex].isExtracting = false;
            }
        }

        function updateSelectionButtons() {
            const checkboxes = document.querySelectorAll('#pdf-list-categories input[type="checkbox"]');
            const checkedCount = document.querySelectorAll('#pdf-list-categories input[type="checkbox"]:checked').length;
            const totalCount = checkboxes.length;

            const activeClass = "bg-[#F27E23] text-white hover:bg-opacity-90";
            const inactiveClass = "bg-gray-200 text-gray-700 hover:bg-gray-300";

            if (checkedCount === 0) {
                selectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${activeClass}`;
                deselectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${inactiveClass} opacity-50 cursor-not-allowed`;
            } else if (checkedCount === totalCount) {
                selectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${inactiveClass} opacity-50 cursor-not-allowed`;
                deselectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${activeClass}`;
            } else {
                selectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${inactiveClass}`;
                deselectAllBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-colors ${inactiveClass}`;
            }
        }
        
        function updateThumbnailButtonState() {
            const isHidden = document.getElementById('document-selection').classList.contains('thumbnails-hidden');
            toggleThumbnailsBtn.className = `text-sm font-semibold py-1.5 px-3 rounded-md transition-all shadow-sm border ${isHidden ? 'bg-white text-[#041E42] border-[#041E42] hover:bg-gray-100' : 'bg-[#041E42] text-white border-[#041E42] hover:bg-opacity-90'}`;
        }
        
        function setupEventListeners() {
            selectAllBtn.addEventListener('click', () => {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
                updateSelectionButtons();
            });

            deselectAllBtn.addEventListener('click', () => {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                updateSelectionButtons();
            });

            toggleThumbnailsBtn.addEventListener('click', () => {
                document.getElementById('document-selection').classList.toggle('thumbnails-hidden');
                updateThumbnailButtonState();
            });

            searchInput.addEventListener('input', () => {
                clearSearchBtn.classList.toggle('hidden', !searchInput.value);
                if(!searchInput.value) {
                    mainSearchCount.classList.add('hidden');
                    mainSearchCount.textContent = '';
                }
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                resultsContainer.innerHTML = `
                     <div class="flex flex-col items-center justify-center py-16 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                        <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
                        <p class="text-xl font-semibold text-gray-500 mb-1">Search cleared</p>
                    </div>`;
                mainSearchCount.classList.add('hidden');
                clearSearchBtn.classList.add('hidden');
            });

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') performSearch(); });
            
            closeModalBtn.addEventListener('click', closePdfViewer);

            viewerSearchInput.addEventListener('input', (e) => {
                if (peakPdfFindController) {
                    peakPdfFindController.executeCommand('find', {
                        query: e.target.value,
                        highlightAll: true,
                        phraseSearch: true
                    });
                }
            });

            viewerSearchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (peakPdfFindController) {
                        peakPdfFindController.executeCommand('findagain', {
                            query: viewerSearchInput.value,
                            highlightAll: true,
                            phraseSearch: true,
                            findPrevious: e.shiftKey
                        });
                    }
                }
            });

            viewerSearchNext.addEventListener('click', () => {
                if (peakPdfFindController) {
                    peakPdfFindController.executeCommand('findagain', {
                        query: viewerSearchInput.value,
                        highlightAll: true,
                        phraseSearch: true,
                        findPrevious: false
                    });
                }
            });

            viewerSearchPrev.addEventListener('click', () => {
                if (peakPdfFindController) {
                    peakPdfFindController.executeCommand('findagain', {
                        query: viewerSearchInput.value,
                        highlightAll: true,
                        phraseSearch: true,
                        findPrevious: true
                    });
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closePdfViewer();
                }
            });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.remove('hidden');
                } else {
                    backToTopBtn.classList.add('hidden');
                }
            });
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.querySelectorAll('.collapsible-section > button').forEach(button => {
                button.addEventListener('click', () => {
                    button.parentElement.classList.toggle('open');
                });
            });
        }
        
        async function performSearch() {
            currentSearchQuery = searchInput.value;
            const isCaseSensitive = caseSensitiveCheck.checked;
            const isWholeWord = wholeWordCheck.checked;
            let query = currentSearchQuery.trim();

            if (!query) {
                resultsContainer.innerHTML = '<p class="text-red-500 font-medium">Please enter a search term.</p>';
                mainSearchCount.classList.add('hidden');
                return;
            }
            
            const selectedPdfIndexes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => parseInt(cb.dataset.pdfIndex));
            if (selectedPdfIndexes.length === 0) {
                resultsContainer.innerHTML = '<p class="text-red-500 font-medium">Please select at least one document filter above.</p>';
                mainSearchCount.classList.add('hidden');
                return;
            }
            
            // Auto-scroll to results
            setTimeout(() => {
                resultsSectionContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 50);

            // Render Progress Bar UI
            resultsContainer.innerHTML = `
                <div class="w-full max-w-2xl mx-auto p-8 my-8 bg-gray-50 rounded-xl border border-gray-200 shadow-sm">
                    <div class="mb-4 flex justify-between items-end">
                        <div>
                            <h3 class="text-xl font-bold text-[#041E42] mb-1">Scanning Archives</h3>
                            <p class="text-sm font-medium text-gray-500" id="search-status">Initializing scanner...</p>
                        </div>
                        <span class="text-[#F27E23] font-black text-2xl" id="search-progress-text">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
                        <div class="bg-gradient-to-r from-orange-400 to-[#F27E23] h-4 rounded-full transition-all duration-300 ease-out" id="search-progress-bar" style="width: 0%"></div>
                    </div>
                </div>`;
                
            const searchStatus = document.getElementById('search-status');
            const searchProgressBar = document.getElementById('search-progress-bar');
            const searchProgressText = document.getElementById('search-progress-text');

            let foundResults = false;
            let totalMatches = 0;
            const flags = isCaseSensitive ? 'g' : 'gi';
            const term = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(isWholeWord ? `\\b${term}\\b` : term, flags);
            
            // Smart Heuristic Regex for Legal Documents
            const sectionRegex = /(?:Section|Seksyen|Peraturan|Regulation|Part|Bahagian|Rule|Kaedah)\s+([A-Z0-9]+(?:\.[A-Z0-9]+)*)/gi;
            
            const tempResultsContainer = document.createDocumentFragment();

            for (let i = 0; i < selectedPdfIndexes.length; i++) {
                const index = selectedPdfIndexes[i];
                const pdf = pdfData[index];
                if (!pdf) continue;

                // Update Progress
                const progressPercentage = Math.round((i / selectedPdfIndexes.length) * 100);
                searchProgressBar.style.width = `${progressPercentage}%`;
                searchProgressText.textContent = `${progressPercentage}%`;
                searchStatus.textContent = `Reading: ${pdf.displayName}`;

                if (pdf.content === null) {
                    await extractPdfText(index);
                }

                if (!pdf.content || pdf.content[0].startsWith("Error:")) continue;

                const fileResultContainer = document.createElement('div');
                let foundInFile = false;
                
                pdf.content.forEach((pageText, pageIndex) => {
                    let match;
                    let pageSnippets = [];
                    regex.lastIndex = 0;
                    
                    while ((match = regex.exec(pageText)) !== null) {
                        if (!foundInFile) foundInFile = true;
                        totalMatches++;
                        
                        // Extract Snippet Context
                        const contextRadius = 80;
                        const snippetStart = Math.max(0, match.index - contextRadius);
                        const snippetEnd = Math.min(pageText.length, match.index + match[0].length + contextRadius);
                        let snippet = pageText.substring(snippetStart, snippetEnd);
                        snippet = snippet.replace(new RegExp(term, flags), `<strong class="bg-[#F27E23] bg-opacity-30 text-[#F27E23] font-bold px-1 rounded-sm">$&</strong>`);
                        if (snippetStart > 0) snippet = '... ' + snippet;
                        if (snippetEnd < pageText.length) snippet = snippet + ' ...';
                        pageSnippets.push(snippet);
                    }

                    if (pageSnippets.length > 0) {
                        const pageNum = pageIndex + 1;
                        
                        // Heuristic Parsing for Title
                        let sectionName = "";
                        const textBeforeMatches = pageText.substring(0, pageText.indexOf(pageSnippets[0].replace(/<[^>]*>?/gm, '')));
                        let secMatch;
                        while ((secMatch = sectionRegex.exec(textBeforeMatches)) !== null) {
                            sectionName = secMatch[0].charAt(0).toUpperCase() + secMatch[0].slice(1).toLowerCase();
                        }
                        
                        let displayTitle = `Page ${pageNum}`;
                        if(sectionName) {
                            displayTitle += ` <span class="mx-2 text-gray-300">|</span> <span class="text-[#F27E23] font-semibold">${sectionName}</span>`;
                        }

                        const pageResultDiv = document.createElement('div');
                        pageResultDiv.className = 'mt-4 pl-4 border-l-4 border-[#041E42] bg-gray-50 p-5 rounded-r-xl relative group shadow-sm';
                        pageResultDiv.innerHTML = `<p class="font-bold text-gray-800 mb-3 flex items-center gap-2 text-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#F27E23]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            ${displayTitle}
                        </p>`;
                        
                        const goToPageBtn = document.createElement('button');
                        goToPageBtn.innerHTML = 'View Match &rarr;';
                        goToPageBtn.className = 'absolute top-4 right-4 bg-white border border-gray-200 text-[#041E42] font-bold py-1.5 px-4 rounded-md hover:bg-[#041E42] hover:text-white transition-all text-sm shadow-sm';
                        goToPageBtn.onclick = () => openPdfViewer(index, pageNum);
                        pageResultDiv.appendChild(goToPageBtn);
                        
                        pageSnippets.forEach(snippetText => {
                            const snippetP = document.createElement('p');
                            snippetP.className = 'text-gray-700 leading-relaxed mt-2 text-sm bg-white p-4 rounded-md border border-gray-100 shadow-sm font-medium';
                            snippetP.innerHTML = snippetText;
                            pageResultDiv.appendChild(snippetP);
                        });
                        fileResultContainer.appendChild(pageResultDiv);
                    }
                });
                
                if (foundInFile) {
                    foundResults = true;
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'mb-6 p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow';
                    resultDiv.innerHTML = `
                        <div class="flex items-center gap-3 mb-2 border-b border-gray-100 pb-4">
                            <div class="bg-orange-100 p-2.5 rounded-lg shadow-inner">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#F27E23]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            </div>
                            <h3 class="text-xl font-bold text-[#041E42]">${pdf.displayName}</h3>
                        </div>`;
                    resultDiv.appendChild(fileResultContainer);
                    tempResultsContainer.appendChild(resultDiv);
                }
            }
            
            resultsContainer.innerHTML = '';
            if (!foundResults) {
                resultsContainer.innerHTML = '<p class="text-gray-600 font-medium text-lg py-8 text-center">No results found for your query in the selected documents.</p>';
                mainSearchCount.classList.add('hidden');
            } else {
                resultsContainer.appendChild(tempResultsContainer);
                mainSearchCount.textContent = `${totalMatches} matches found`;
                mainSearchCount.classList.remove('hidden');
            }
        }
        
        function openPdfViewer(pdfIndex, pageNumToShow) {
            const pdfItem = pdfData[pdfIndex];
            if (!pdfItem) return;

            pdfViewerTitle.textContent = pdfItem.displayName;
            const pdfUrl = new URL(pdfItem.name, window.location.href).href;
            
            viewerSearchInput.value = currentSearchQuery;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('overflow-hidden');

            const container = document.getElementById('viewerContainer');

            // Initialize the custom viewer precisely once
            if (!peakPdfViewer) {
                peakEventBus = new pdfjsViewer.EventBus();
                peakPdfFindController = new pdfjsViewer.PDFFindController({ eventBus: peakEventBus });
                
                peakPdfViewer = new pdfjsViewer.PDFViewer({
                    container: container,
                    eventBus: peakEventBus,
                    findController: peakPdfFindController,
                });

                // Attach listener to trigger jump & search once pages render
                peakEventBus.on('pagesinit', function () {
                    peakPdfViewer.currentScaleValue = 'page-width';
                    setTimeout(() => {
                        if (window.pendingPageNumToShow) {
                            peakPdfViewer.currentPageNumber = window.pendingPageNumToShow;
                        }
                        if (currentSearchQuery) {
                            peakPdfFindController.executeCommand('find', {
                                query: currentSearchQuery,
                                phraseSearch: wholeWordCheck.checked,
                                caseSensitive: caseSensitiveCheck.checked,
                                highlightAll: true
                            });
                        }
                    }, 50);
                });
            }

            // Check if we are opening a NEW document or navigating inside the ALREADY open document
            if (peakPdfViewer.pdfDocument && peakPdfViewer._currentUrl === pdfUrl) {
                 // Fast track: Document is already rendered, just jump and highlight
                 peakPdfViewer.currentPageNumber = pageNumToShow;
                 if (currentSearchQuery) {
                     peakPdfFindController.executeCommand('find', {
                         query: currentSearchQuery,
                         phraseSearch: wholeWordCheck.checked,
                         caseSensitive: caseSensitiveCheck.checked,
                         highlightAll: true
                     });
                 }
            } else {
                // Load New Document
                window.pendingPageNumToShow = pageNumToShow;
                peakPdfViewer._currentUrl = pdfUrl; 
                
                container.style.opacity = '0.5'; // Visual loading cue
                
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                loadingTask.promise.then(function(pdfDocument) {
                    peakPdfViewer.setDocument(pdfDocument);
                    container.style.opacity = '1';
                }).catch(function(error) {
                    console.error("Error loading PDF: ", error);
                    container.style.opacity = '1';
                    container.innerHTML = `<div class="flex items-center justify-center h-full"><p class="text-red-500 font-bold bg-white p-4 rounded shadow">Error loading document. Verify file exists at ${pdfUrl}</p></div>`;
                });
            }
        }

        function closePdfViewer() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
            
            // Clean up highlight controller state so it doesn't leak between searches
            if (peakPdfFindController) {
                peakPdfFindController.executeCommand('find', { query: '' }); 
            }
        }

    </script>
